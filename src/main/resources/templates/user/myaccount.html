<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Title</title>
        <!-- Favicon-->
        <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
        <!-- Bootstrap icons-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="/css/styles.css" rel="stylesheet" />
        <!-- Bootstrap core JS-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Core theme JS-->
<!--        <script src="/js/scripts.js"></script>-->
    </head>
    <body class="d-flex flex-column min-vh-100">
        <!-- Header-->
        <header class="bg-dark py-3">
            <div class="container px-4 px-lg-5 text-white text-white-50">
                <a class="navbar-brand" href="/"><h4> Ez Shop Electronics </h4> </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
            </div>
            <div class="container px-4 px-lg-5 my-3">
                <div class="text-center text-white">
                    <h3 class="display-4 fw-bolder">Shop trending electronics products</h3>
                    <p class="lead fw-normal text-white-50 mb-0 d-inline">We promise quality at a competitive price</p>
                </div>
            </div>
        </header>

        <div class="container py-2">

            <h4 class="font-weight-bold py-3 mb-4">
                Account settings
            </h4>

            <div class="d-flex">
                <div class="col-md-3">
                    <div class="nav-pills nav flex-column me-3 mr-auto" id="v-pills-tab" role="tablist" aria-orientation="vertical">
                        <button class="nav-link active " id="v-pills-profile-tab" data-bs-toggle="pill" data-bs-target="#v-pills-profile" type="button" role="tab" aria-controls="v-pills-profile" aria-selected="true" >My Profile</button>
                        <button class="nav-link " id="v-pills-password-tab" data-bs-toggle="pill" data-bs-target="#v-pills-password" type="button" role="tab" aria-controls="v-pills-password" aria-selected="false" >Change Password</button>
                        <button class="nav-link " id="v-pills-orderview-tab" data-bs-toggle="pill" data-bs-target="#v-pills-orderview" type="button" role="tab" aria-controls="v-pills-orderview" aria-selected="false" >Order History</button>
                        <button class="nav-link " id="v-pills-logout-tab" data-bs-toggle="pill" data-bs-target="#v-pills-logout" type="button" role="tab" aria-controls="v-pills-logout" aria-selected="false" >Log Out</button>
                        <button class="nav-link " id="v-pills-settings-tab" data-bs-toggle="pill" data-bs-target="#v-pills-settings" type="button" role="tab" aria-controls="v-pills-settings" aria-selected="false" >Settings</button>
                    </div>
                </div>
                <div class="col-md-9">
                    <form method="post" th:object="${userDto}">
                        <div class="tab-content" id="v-pills-tabContent">
                            <div class="tab-pane fade show active" id="v-pills-profile" role="tabpanel" aria-labelledby="v-pills-profile-tab" tabindex="0">
                                <div class="form-floating mb-3">
                                    <input type="text" th:field="${userDto.firstName}" class="form-control" id="floatingInputFirstName" required autofocus disabled placeholder="First Name">
                                    <label for="floatingInputFirstName">First Name:</label>
                                </div>
                                <p th:if="${#fields.hasErrors('firstName')}" th:errorclass="text-danger" th:errors="${userDto.firstName}"></p>
                                <div class="form-floating mb-3">
                                    <input type="text" th:field="${userDto.lastName}" class="form-control" id="floatingInputLastName" required disabled placeholder="Last Name">
                                    <label for="floatingInputLastName">Last Name:</label>
                                </div>
                                <p th:if="${#fields.hasErrors('lastName')}" th:errorclass="text-danger" th:errors="${userDto.lastName}"></p>
                                <div class="form-floating mb-3">
                                    <input type="email" th:field="${userDto.email}" class="form-control" id="floatingInputEmail" required disabled placeholder="name@example.com">
                                    <label for="floatingInputEmail">Email:</label>
                                </div>
                                <p th:if="${#fields.hasErrors('email')}" th:errorclass="text-danger" th:errors="${userDto.email}"></p>
                            </div>
                            <div class="tab-pane fade" id="v-pills-password" role="tabpanel" aria-labelledby="v-pills-password-tab" tabindex="0"><p>Allow Password change here ....</p></div>
                            <div class="tab-pane fade" id="v-pills-orderview" role="tabpanel" aria-labelledby="v-pills-orderview-tab" tabindex="0"><p>Show Order History here ....</p></div>
                            <div class="tab-pane fade" id="v-pills-logout" role="tabpanel" aria-labelledby="v-pills-logout-tab" tabindex="0"><p>Allow account logout here ....</p></div>
                            <div class="tab-pane fade" id="v-pills-settings" role="tabpanel" aria-labelledby="v-pills-settings-tab" tabindex="0">Allow account seeting change here ....</div>
                        </div>
                    </form>
                </div>
            </div>
            <div class="text-right mt-3">
                <button type="button" class="btn btn-primary">Save changes</button>&nbsp;
                <button type="button" class="btn btn-default">Cancel</button>
            </div>

        </div>
        <!-- Footer-->
        <footer class="py-5 bg-dark mt-auto">
            <div class="container">
                <p class="m-0 text-center text-white">Copyright &copy; Ez Shop Electronics 2025</p>
            </div>
        </footer>
    </body>
</html>
